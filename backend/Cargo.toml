[package]
name = "todo2fast"
version = "0.1.0"
edition = "2021"
description = "Todo2fast — collaborative todo manager with document comprehension"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Native app window (Windows): WebView2 — the same engine as Asana/Figma desktop.
# `tao` owns the native window + event loop; `wry` renders the UI in a WebView2
# control (modern Edge/Chromium, not the legacy IE WebBrowser).
[target.'cfg(windows)'.dependencies]
tao = "0.34"
wry = "0.57"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
