name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend (release)
        working-directory: backend
        run: cargo build --release

      # The installer ships the SPA into {app}\web, so the frontend MUST be
      # built before Inno Setup runs — otherwise the packaged app has no UI.
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\todo2fast.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo2fast-installer-windows
          path: installer/Output/Todo2fast-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/Todo2fast-Setup-*.exe
          generate_release_notes: true
